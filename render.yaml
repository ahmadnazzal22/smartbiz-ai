services:
  - type: web
    name: smartbiz-ai-api
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      # === REQUIRED: Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: JWT_SECRET
        sync: false
      # === Frontend URL (replace with your Vercel domain)
      - key: CORS_ORIGINS
        value: https://smartbiz-ai.vercel.app
      # === PostgreSQL (Render auto-provisions this — set manually if using Neon/Supabase)
      - key: DATABASE_URL
        sync: false
      # === WhatsApp verify token (set in Meta Developer Console)
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # === Optional: AI
      - key: ANTHROPIC_API_KEY
        sync: false
