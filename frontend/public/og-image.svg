<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="50%" style="stop-color:#0a0a18"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glow effects -->
  <ellipse cx="200" cy="315" rx="400" ry="300" fill="url(#glow1)" opacity="0.4"/>
  <ellipse cx="1000" cy="200" rx="300" ry="200" fill="rgba(99,102,241,0.15)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Logo Icon -->
  <rect x="130" y="140" width="70" height="70" rx="16" fill="url(#brand)" filter="url(#glow)"/>
  <text x="165" y="187" font-family="Arial" font-size="32" font-weight="bold" fill="white" text-anchor="middle">S</text>
  
  <!-- Title -->
  <text x="220" y="187" font-family="Arial" font-size="36" font-weight="bold" fill="white">
    Smart<tspan fill="#7c3aed">Biz</tspan> AI
  </text>

  <!-- Main Headline -->
  <text x="130" y="280" font-family="Arial" font-size="52" font-weight="bold" fill="white">
    Turn Your WhatsApp into a
  </text>
  <text x="130" y="345" font-family="Arial" font-size="52" font-weight="bold" fill="url(#brand)">
    24/7 AI Sales Team
  </text>

  <!-- Description -->
  <text x="130" y="410" font-family="Arial" font-size="20" fill="#888">
    SmartBiz AI automates bookings, captures leads, and handles customer
  </text>
  <text x="130" y="440" font-family="Arial" font-size="20" fill="#888">
    conversations — so you can focus on growing your business.
  </text>

  <!-- Features -->
  <g transform="translate(130, 490)">
    <rect x="0" y="0" width="250" height="44" rx="22" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <text x="20" y="28" font-family="Arial" font-size="16" fill="#a78bfa">🤖 AI Chat</text>
  </g>
  <g transform="translate(400, 490)">
    <rect x="0" y="0" width="250" height="44" rx="22" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.2)" stroke-width="1"/>
    <text x="20" y="28" font-family="Arial" font-size="16" fill="#5eead4">📅 Smart Booking</text>
  </g>
  <g transform="translate(670, 490)">
    <rect x="0" y="0" width="250" height="44" rx="22" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="20" y="28" font-family="Arial" font-size="16" fill="#a5b4fc">🔥 Lead Scoring</text>
  </g>

  <!-- Stats -->
  <g transform="translate(130, 560)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#555">★ 4.9 Rating · 3,000+ Teams · Free Trial</text>
  </g>
</svg>
